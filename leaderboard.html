<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>leaderboard — katakatla</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo-link">
      <h1 class="logo">katakatla</h1>
    </a>
    <p class="page-label">leaderboard</p>
  </header>

  <main class="lb-page">
    <div class="page-top-bar">
      <a href="index.html" class="back-link">← balik ke game</a>
      <button id="theme-toggle" class="lb-link" type="button" aria-label="ganti tema" style="margin-top:0;">🌙</button>
    </div>

    <div class="lb-tabs">
      <button class="lb-tab active" data-period="daily">harian</button>
      <button class="lb-tab" data-period="weekly">mingguan</button>
      <button class="lb-tab" data-period="monthly">bulanan</button>
      <button class="lb-tab" data-period="yearly">tahunan</button>
    </div>

    <div class="lb-nav">
      <button id="lb-nav-prev" class="lb-nav-btn" type="button" aria-label="periode sebelumnya">‹</button>
      <div id="lb-info" class="lb-info"></div>
      <button id="lb-nav-next" class="lb-nav-btn" type="button" aria-label="periode berikutnya">›</button>
    </div>

    <div id="lb-loading" class="lb-loading">memuat...</div>

    <table id="lb-table" class="lb-table hidden">
      <thead>
          <tr>
            <th class="col-rank">#</th>
            <th class="col-name">USERNAME</th>
            <th class="col-solved">SELESAI</th>
            <th class="col-score">SKOR</th>
          </tr>
        </thead>
      <tbody id="lb-tbody"></tbody>
    </table>

    <div id="lb-empty" class="lb-empty hidden">belum ada pemain. jadilah yang pertama!</div>
    
    <div id="lb-my-rank" class="lb-my-rank hidden">
      <div class="lb-my-rank-label">posisi kamu</div>
      <table class="lb-table lb-my-rank-table">
        <tbody id="lb-my-rank-tbody"></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="leaderboard.js"></script>

<footer class="site-footer">
    <div class="site-footer-credit">made with ❤️ by anas</div>
    <div class="site-footer-links">
      <a href="privacy.html">privasi</a>
      <span>·</span>
      <a href="terms.html">syarat</a>
      <span>·</span>
      <a href="https://github.com/manasardi/katakatla" target="_blank" rel="noopener">github</a>
    </div>
  </footer>
  
<script>
    (function() {
      const THEME_KEY = 'katakatla_theme';
      function getEffectiveTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved) return saved;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const btn = document.getElementById('theme-toggle');
        if (btn) {
          btn.textContent = theme === 'dark' ? '☀️' : '🌙';
          btn.setAttribute('aria-label', theme === 'dark' ? 'mode terang' : 'mode gelap');
        }
      }
      function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || getEffectiveTheme();
        const next = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem(THEME_KEY, next);
        applyTheme(next);
      }
      applyTheme(getEffectiveTheme());
      document.addEventListener('DOMContentLoaded', function() {
        const btn = document.getElementById('theme-toggle');
        if (btn) btn.addEventListener('click', toggleTheme);
      });
    })();
  </script>
</body>
</html>
