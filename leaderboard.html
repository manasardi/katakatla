<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>katakatla — papan peringkat</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%237A8C3A%22/><text y=%22.9em%22 font-size=%2270%22 x=%2250%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22700%22 fill=%22white%22>k</text></svg>">
  <link rel="stylesheet" href="style.css">

  <!-- Inline theme apply biar nggak flash -->
  <script>
    (function() {
      const saved = localStorage.getItem('katakatla_theme');
      const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo-link">
      <h1 class="logo">katakatla</h1>
    </a>
    <p class="page-label">Papan Peringkat</p>
  </header>

  <main class="lb-page">
    <div class="page-top-bar">
      <a href="index.html" class="back-link">← Kembali ke Permainan</a>
      <button id="theme-toggle" class="lb-link" type="button" aria-label="Ganti Tema" style="margin-top:0;">🌙</button>
    </div>

    <div class="lb-tabs">
      <button class="lb-tab active" data-period="daily">Harian</button>
      <button class="lb-tab" data-period="weekly">Mingguan</button>
      <button class="lb-tab" data-period="monthly">Bulanan</button>
      <button class="lb-tab" data-period="yearly">Tahunan</button>
    </div>

    <div class="lb-nav">
      <button id="lb-nav-prev" class="lb-nav-btn" type="button" aria-label="Periode Sebelumnya">‹</button>
      <div id="lb-info" class="lb-info"></div>
      <button id="lb-nav-next" class="lb-nav-btn" type="button" aria-label="Periode Berikutnya">›</button>
    </div>

    <div id="lb-loading" class="lb-loading">Memuat...</div>

    <table id="lb-table" class="lb-table hidden">
      <thead>
        <tr>
          <th class="col-rank">#</th>
          <th class="col-name">USERNAME</th>
          <th class="col-solved">SELESAI</th>
          <th class="col-score">SKOR</th>
        </tr>
      </thead>
      <tbody id="lb-tbody"></tbody>
    </table>

    <div id="lb-empty" class="lb-empty hidden">Belum ada pemain. Jadilah yang pertama!</div>

    <div id="lb-my-rank" class="lb-my-rank hidden">
      <div class="lb-my-rank-label">Posisi Anda</div>
      <table class="lb-table lb-my-rank-table">
        <tbody id="lb-my-rank-tbody"></tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer-links">
      <a href="privacy.html">Kebijakan Privasi</a>
      <span>·</span>
      <a href="terms.html">Syarat & Ketentuan</a>
      <span>·</span>
      <a href="https://github.com/manasardi/katakatla" target="_blank" rel="noopener">Repositori GitHub</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="leaderboard.js"></script>

  <script>
    (function() {
      const THEME_KEY = 'katakatla_theme';
      function getEffectiveTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved) return saved;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const btn = document.getElementById('theme-toggle');
        if (btn) {
          btn.textContent = theme === 'dark' ? '☀️' : '🌙';
          btn.setAttribute('aria-label', theme === 'dark' ? 'Mode Terang' : 'Mode Gelap');
        }
      }
      function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || getEffectiveTheme();
        const next = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem(THEME_KEY, next);
        applyTheme(next);
      }
      applyTheme(getEffectiveTheme());
      document.addEventListener('DOMContentLoaded', function() {
        const btn = document.getElementById('theme-toggle');
        if (btn) btn.addEventListener('click', toggleTheme);
      });
    })();
  </script>
</body>
</html>
