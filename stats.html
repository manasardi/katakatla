<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stats — katakatla</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo-link">
      <h1 class="logo">katakatla</h1>
    </a>
    <p class="page-label">stats</p>
  </header>

  <main class="lb-page">
    <a href="index.html" class="back-link">← kembali ke game</a>

    <div id="stats-loading" class="lb-loading">memuat stats...</div>

    <div id="stats-content" class="hidden">
      <!-- Hero stats: 3 big numbers -->
      <section class="stats-hero">
        <div class="hero-card">
          <div class="hero-value" id="stat-played">0</div>
          <div class="hero-label">total dimainkan</div>
        </div>
        <div class="hero-card">
          <div class="hero-value" id="stat-winrate">0<span class="hero-unit">%</span></div>
          <div class="hero-label">win rate</div>
        </div>
        <div class="hero-card">
          <div class="hero-value" id="stat-score">0</div>
          <div class="hero-label">total skor</div>
        </div>
      </section>

      <!-- Streak -->
      <section class="stats-streak">
        <div class="streak-icon">🔥</div>
        <div class="streak-info">
          <div class="streak-value" id="stat-streak">0 hari</div>
          <div class="streak-label">streak berturut-turut</div>
        </div>
      </section>

      <!-- Score distribution -->
      <section class="stats-section">
        <h3 class="section-title">distribusi tebakan</h3>
        <p class="section-subtitle">berapa kali menang di tebakan ke-N</p>
        <div id="distribution-chart" class="dist-chart"></div>
      </section>

      <!-- Recent days -->
      <section class="stats-section">
        <h3 class="section-title">7 hari terakhir</h3>
        <div id="recent-days" class="recent-list"></div>
      </section>
    </div>

    <div id="stats-empty" class="lb-empty hidden">
      belum ada data. main dulu yuk!
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="stats.js"></script>
</body>
</html>
